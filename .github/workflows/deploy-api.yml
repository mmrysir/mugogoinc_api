name: Deploy Mugogo API

on:
  push:
    branches: [ main ]

concurrency:
  group: production-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Mugogo API to DigitalOcean via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            # ── Ensure PM2 and common binary paths are in PATH ─────────────
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            # ── Create app folder if it doesn't exist ─────────────────────────
            mkdir -p /var/www/mugogoinc/mugogoinc_api
            cd /var/www/mugogoinc/mugogoinc_api

            if [ ! -f .env ]; then
              echo "ERROR: Production .env is missing; refusing to deploy without its configuration."
              exit 1
            fi

            # ── Pull latest code ─────────────────────────────────────────────
            if [ ! -d ".git" ]; then
              git clone https://github.com/mmrysir/mugogoinc_api.git .
            else
              git pull origin main
            fi

            # ── Setup virtual environment & install dependencies ─────────────
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # ── Run database migrations ──────────────────────────────────────
            PYTHONPATH=. alembic upgrade head

            # ── Start or restart under PM2 ───────────────────────────────────
            PM2_PATH=$(which pm2 || echo "/usr/local/bin/pm2")

            $PM2_PATH startOrReload ecosystem.config.js --update-env
            $PM2_PATH save