name: Deploy Mugogo API

on:
  push:
    branches: [ main ]

concurrency:
  group: production-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Mugogo API to DigitalOcean via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GSC_CLIENT_ID:                 ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET:             ${{ secrets.GSC_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN:    ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:          ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:      ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:      ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID:        ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID:  ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CONVERSION_ACTION_ID: ${{ secrets.GOOGLE_ADS_CONVERSION_ACTION_ID }}
          APP_BASE_URL:                  ${{ secrets.APP_BASE_URL }}
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          envs: GSC_CLIENT_ID,GSC_CLIENT_SECRET,GOOGLE_ADS_DEVELOPER_TOKEN,GOOGLE_ADS_CLIENT_ID,GOOGLE_ADS_CLIENT_SECRET,GOOGLE_ADS_REFRESH_TOKEN,GOOGLE_ADS_CUSTOMER_ID,GOOGLE_ADS_LOGIN_CUSTOMER_ID,GOOGLE_ADS_CONVERSION_ACTION_ID,APP_BASE_URL
          script: |
            set -e

            # ── Ensure PM2 and common binary paths are in PATH ─────────────
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            # ── Create app folder if it doesn't exist ─────────────────────────
            mkdir -p /var/www/mugogoinc/mugogoinc_api
            cd /var/www/mugogoinc/mugogoinc_api

            if [ ! -f .env ]; then
              echo "ERROR: Production .env is missing; refusing to deploy without its configuration."
              exit 1
            fi

            # ── Pull latest code ─────────────────────────────────────────────
            if [ ! -d ".git" ]; then
              git clone https://github.com/mmrysir/mugogoinc_api.git .
            else
              git pull origin main
            fi

            # ── Inject GSC secrets into .env (upsert — never echo values) ───
            # sed updates the line if the key exists; grep+echo appends if missing.
            # Values flow from GitHub Secrets → env vars → file. Never logged.
            _upsert_env() {
              local key="$1" val="$2" file=".env"
              if grep -q "^${key}=" "$file"; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$file"
              else
                echo "${key}=${val}" >> "$file"
              fi
            }
            _upsert_env "GSC_CLIENT_ID"                 "$GSC_CLIENT_ID"
            _upsert_env "GSC_CLIENT_SECRET"             "$GSC_CLIENT_SECRET"
            _upsert_env "GOOGLE_ADS_DEVELOPER_TOKEN"    "$GOOGLE_ADS_DEVELOPER_TOKEN"
            _upsert_env "GOOGLE_ADS_CLIENT_ID"          "$GOOGLE_ADS_CLIENT_ID"
            _upsert_env "GOOGLE_ADS_CLIENT_SECRET"      "$GOOGLE_ADS_CLIENT_SECRET"
            _upsert_env "GOOGLE_ADS_REFRESH_TOKEN"      "$GOOGLE_ADS_REFRESH_TOKEN"
            _upsert_env "GOOGLE_ADS_CUSTOMER_ID"        "$GOOGLE_ADS_CUSTOMER_ID"
            _upsert_env "GOOGLE_ADS_LOGIN_CUSTOMER_ID"  "$GOOGLE_ADS_LOGIN_CUSTOMER_ID"
            _upsert_env "GOOGLE_ADS_CONVERSION_ACTION_ID" "$GOOGLE_ADS_CONVERSION_ACTION_ID"
            _upsert_env "APP_BASE_URL"                  "$APP_BASE_URL"

            # ── Setup virtual environment & install dependencies ─────────────
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # ── Run database migrations ──────────────────────────────────────
            PYTHONPATH=. alembic upgrade head

            # ── Start or restart under PM2 ───────────────────────────────────
            PM2_PATH=$(which pm2 || echo "/usr/local/bin/pm2")

            $PM2_PATH startOrReload ecosystem.config.js --update-env
            $PM2_PATH save