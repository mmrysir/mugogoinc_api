name: Deploy Mugogo API

on:
  push:
    branches: [ main ]

concurrency:
  group: production-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          script: |
            # Load environment PATH for NVM, Node, and PM2
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            echo "--> Navigating to API directory"
            cd /var/www/mugogoinc/mugogoinc_api

            if [ ! -f .env ]; then
              echo "ERROR: Production .env is missing; refusing to deploy without its configuration."
              exit 1
            fi

            echo "--> Pulling latest code from main"
            rm -f .git/refs/remotes/origin/main.lock .git/index.lock
            git fetch --force origin main
            git reset --hard FETCH_HEAD

            echo "--> Activating Python Virtual Environment and updating dependencies"
            if [ -d "venv" ]; then
              source venv/bin/activate
            else
              python3 -m venv venv
              source venv/bin/activate
            fi
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "--> Injecting Google Ads GitHub Secrets into .env"
            # Safely replace or append the secrets in the production .env file
            
            # Client ID
            if [ -n "${{ secrets.GOOGLE_ADS_CLIENT_ID }}" ]; then
              grep -q '^GOOGLE_ADS_CLIENT_ID=' .env && sed -i "s|^GOOGLE_ADS_CLIENT_ID=.*|GOOGLE_ADS_CLIENT_ID=${{ secrets.GOOGLE_ADS_CLIENT_ID }}|" .env || echo "GOOGLE_ADS_CLIENT_ID=${{ secrets.GOOGLE_ADS_CLIENT_ID }}" >> .env
            fi
            
            # Client Secret
            if [ -n "${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}" ]; then
              grep -q '^GOOGLE_ADS_CLIENT_SECRET=' .env && sed -i "s|^GOOGLE_ADS_CLIENT_SECRET=.*|GOOGLE_ADS_CLIENT_SECRET=${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}|" .env || echo "GOOGLE_ADS_CLIENT_SECRET=${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}" >> .env
            fi
            
            # Refresh Token
            if [ -n "${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}" ]; then
              grep -q '^GOOGLE_ADS_REFRESH_TOKEN=' .env && sed -i "s|^GOOGLE_ADS_REFRESH_TOKEN=.*|GOOGLE_ADS_REFRESH_TOKEN=${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}|" .env || echo "GOOGLE_ADS_REFRESH_TOKEN=${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}" >> .env
            fi
            
            # Developer Token
            if [ -n "${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}" ]; then
              grep -q '^GOOGLE_ADS_DEVELOPER_TOKEN=' .env && sed -i "s|^GOOGLE_ADS_DEVELOPER_TOKEN=.*|GOOGLE_ADS_DEVELOPER_TOKEN=${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}|" .env || echo "GOOGLE_ADS_DEVELOPER_TOKEN=${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}" >> .env
            fi
            
            # Customer ID
            if [ -n "${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}" ]; then
              grep -q '^GOOGLE_ADS_CUSTOMER_ID=' .env && sed -i "s|^GOOGLE_ADS_CUSTOMER_ID=.*|GOOGLE_ADS_CUSTOMER_ID=${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}|" .env || echo "GOOGLE_ADS_CUSTOMER_ID=${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}" >> .env
            fi
            
            # Login Customer ID (MCC) - Optional
            if [ -n "${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}" ]; then
              grep -q '^GOOGLE_ADS_LOGIN_CUSTOMER_ID=' .env && sed -i "s|^GOOGLE_ADS_LOGIN_CUSTOMER_ID=.*|GOOGLE_ADS_LOGIN_CUSTOMER_ID=${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}|" .env || echo "GOOGLE_ADS_LOGIN_CUSTOMER_ID=${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}" >> .env
            fi

            echo "--> Running Alembic Database Migrations"
            alembic upgrade head

            echo "--> Restarting FastAPI application via PM2 ecosystem config"
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
